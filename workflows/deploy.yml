name: Deploy WillFit
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: willfit-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify dashboard
        run: npm test
      - name: Configure shared database
        env:
          WILLFIT_D1_ID: ${{ vars.WILLFIT_D1_ID }}
          WILLFIT_VAPID_PUBLIC_KEY: ${{ vars.WILLFIT_VAPID_PUBLIC_KEY }}
        run: node scripts/configure-deployment.mjs
      - name: Apply database migrations
        run: npx --yes wrangler@4 d1 migrations apply willfit-media --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy website, Sunday planning and posting reminders
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
